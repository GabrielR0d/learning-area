name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'saas-checkin/**'
  pull_request:
    branches: [main]
    paths:
      - 'saas-checkin/**'

defaults:
  run:
    working-directory: saas-checkin

jobs:
  backend-typecheck:
    name: Backend TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: saas-checkin/backend/package-lock.json

      - name: Install dependencies
        working-directory: saas-checkin/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: saas-checkin/backend
        run: npx prisma generate

      - name: TypeScript check
        working-directory: saas-checkin/backend
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: saas-checkin/frontend/package-lock.json

      - name: Install dependencies
        working-directory: saas-checkin/frontend
        run: npm ci

      - name: TypeScript + Build
        working-directory: saas-checkin/frontend
        run: npm run build

  card-reader-typecheck:
    name: Card Reader TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: saas-checkin/card-reader-client/package-lock.json

      - name: Install dependencies
        working-directory: saas-checkin/card-reader-client
        run: npm ci

      - name: TypeScript check
        working-directory: saas-checkin/card-reader-client
        run: npx tsc --noEmit
