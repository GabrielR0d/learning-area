version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rfid_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rfid_saas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rfid_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    networks:
      - internal

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    restart: always
    environment:
      SERVER_URL: ${EVOLUTION_URL:?EVOLUTION_URL is required}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_MASTER_KEY:?EVOLUTION_MASTER_KEY is required}
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/evolution
      REDIS_ENABLED: "true"
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      LOG_LEVEL: ERROR
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
      - public

  backend:
    image: node:20-alpine
    container_name: rfid_backend
    restart: always
    working_dir: /app
    command: sh -c "npm ci --omit=dev && npx prisma migrate deploy && node dist/server.js"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rfid_saas}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      NODE_ENV: production
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
      - public
    ports:
      - "3001:3001"

  frontend:
    image: nginx:alpine
    container_name: rfid_frontend
    restart: always
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - public

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  pg_data:
  redis_data:
